# Static type check for the coach's Python (run: bash ci.sh, or .tools/typing/bin/mypy; installed by tools/dev-setup.sh).
# Every live/*.py, live/voice/*.py and tools/*.py is checked; the modules listed under "strict" below must be fully
# annotated. The modules are scripts on sys.path (live/ and live/voice/), not a package: mypy_path mirrors that.
[mypy]
python_version = 3.12
files = live, tools
exclude = (?x)(
    ^live/(\.pkgs|\.python|\.venv|\.uv-cache|\.models|out|web|voice/out|voice/\.uv-cache)/
  )
mypy_path = live:live/voice:tools
explicit_package_bases = True
plugins = pydantic.mypy
warn_unused_configs = True
cache_dir = .tools/mypy_cache
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
extra_checks = True
# basic level for everything not listed below: annotated functions are checked, unannotated bodies are not
check_untyped_defs = False

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

# strict: the rules client, the booth brain, the watch feed, history/review, the trace, the DB, the mic intent lane, the SC2 window lookup, plus the models
[mypy-models,rules_client,brain,brain_run,watch,history,looptime,db,intents,sc2window]
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_return_any = True
no_implicit_reexport = True

# Windows-only / GPU packages: live/.pkgs holds Windows wheels, so WSL has no stubs for them
[mypy-dxcam.*,mss.*,PIL.*,numpy.*,faster_whisper.*,ctranslate2.*,sounddevice.*,pynput.*,typesafe_sdk.*]
ignore_missing_imports = True
