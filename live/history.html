<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SC2 Game History</title>
<style>
/* Game history, served by timing.py at /history. history.py renders the fragments server-side; htmx swaps
   them in, Alpine keeps the small UI state (selected row, filters, calls expander). Same tokens as overlay.html. */
:root{
  --bg:#070b12; --panel:#0e1621; --line:#22344a; --fg:#d6e3f0; --muted:#7f93a8;
  --terran:#4fb3ff; --coach:#b48cff; --alert:#ff8a2b; --ok:#5fe3a1; --bad:#ff5c5c;
  --mono:"Share Tech Mono",ui-monospace,Consolas,monospace; --ui:"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[x-cloak]{display:none !important}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.top h1{margin:0;font-size:1.3rem}
.top h1 b{color:var(--terran)}
.top .grow{flex:1}
button,select{font:inherit;font-weight:700;background:#0a111a;border:1px solid var(--line);color:var(--fg);padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--terran);color:var(--terran)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--alert);outline-offset:2px}
.seg{display:flex}
.seg button+button{border-left:none}
label{color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:6px}
h2{margin:0 0 6px;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dim{color:var(--muted)}
.tag{font-size:.75rem;font-weight:400;border:1px solid var(--coach);color:var(--coach);padding:1px 6px;vertical-align:middle}
.win{color:var(--ok)} .loss{color:var(--bad)} .other{color:var(--muted)}
.ok{color:var(--ok)} .warn{color:var(--alert)} .bad{color:var(--bad)}
.empty{color:var(--muted);padding:12px}
.htmx-request .busy{opacity:1}
.busy{opacity:0;font-family:var(--mono);font-size:.8rem;color:var(--muted);transition:opacity .2s}

.main{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.main>*,.wrap>*{min-width:0}
@media (min-width:1000px){
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  #detail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
}
.panel{background:var(--panel);border:1px solid var(--line);padding:10px 12px;min-width:0}

/* Trend strip: last results, oldest left */
.trend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
.trend h2{margin:0}
.trend ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.trend li{display:grid;justify-items:center;min-width:30px;padding:3px 4px;border:1px solid var(--line);background:#0a111a;font-family:var(--mono)}
.trend li b{font-weight:400}
.trend li small{color:var(--muted);font-size:.72rem}
.trend li.win{border-color:var(--ok)} .trend li.loss{border-color:var(--bad)}
.tally{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.tally b{font-weight:400}

/* Games list: a grid of links; two lines per game on a phone */
.games{display:grid;gap:3px}
.row{display:grid;grid-template-columns:44px 128px 66px 50px 34px minmax(0,1fr) 62px 46px 70px;gap:8px;align-items:baseline;
  padding:7px 10px;background:#0a111a;border-left:3px solid var(--line);color:var(--fg);text-decoration:none;font-size:.9rem}
.row:hover{background:#13202f}
.row.sel{background:#16263a;box-shadow:inset 0 0 0 1px var(--terran);border-left-color:var(--terran)}
.row.head{background:none;border-left-color:transparent;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row .id,.row .dt,.row .len,.row .pl,.row .six,.row .blk,.row .bank{font-family:var(--mono)}
.row .id,.row .dt{color:var(--muted)}
.row .opp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .six b{font-weight:400} .row .six small{color:var(--muted)}
.row .len,.row .six,.row .blk,.row .bank{text-align:right}
@media (max-width:700px){
  .row{grid-template-columns:40px 66px 44px minmax(0,1fr) 54px 30px;grid-template-areas:"id res len pl six blk" "dt dt dt opp opp bank"}
  .row.head{display:none}
  .row .id{grid-area:id} .row .res{grid-area:res} .row .len{grid-area:len} .row .pl{grid-area:pl}
  .row .six{grid-area:six} .row .blk{grid-area:blk} .row .dt{grid-area:dt;font-size:.78rem} .row .opp{grid-area:opp;font-size:.82rem}
  .row .bank{grid-area:bank;font-size:.78rem}
}

/* Detail */
.dhead h1{margin:0;font-size:1.4rem}
.dhead p{margin:4px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.tile{background:#0a111a;border:1px solid var(--line);padding:8px 10px}
.tile small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--mono);font-weight:400;font-size:1.6rem;color:#fff}
.tile b.ok{color:var(--ok)} .tile b.bad{color:var(--bad)} .tile b.warn{color:var(--alert)}
.tile b+small{display:inline;letter-spacing:0;text-transform:none;font-family:var(--mono);font-size:.9rem}
.tile span{display:block;font-family:var(--mono);color:var(--muted);font-size:.8rem}
.legend{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.k-used{border-color:var(--terran)} .k-plan{border-color:var(--fg);border-top-style:dashed !important}
.k-cap{border-color:var(--muted);border-top-style:dotted !important} .k-blk{border-color:var(--bad)}
.k-min{border-color:var(--terran)} .k-gas{border-color:var(--ok)}
.scroll{overflow-x:auto}
.chart{display:block;width:100%;min-width:520px;height:auto}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .ptitle{fill:var(--fg);font-family:var(--ui);font-size:12px;font-weight:600}
.chart .ylab{text-anchor:end} .chart .xlab{text-anchor:middle}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart path{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .s-used,.chart .s-min{stroke:var(--terran)}
.chart .s-plan{stroke:var(--fg);stroke-dasharray:5 4;stroke-width:1.5;opacity:.75}
.chart .s-cap{stroke:var(--muted);stroke-dasharray:2 3;stroke-width:1.5}
.chart .s-gas{stroke:var(--ok)}
.chart .blk{stroke:var(--bad);stroke-width:1.5;opacity:.8}
.chart .blab{fill:var(--bad);font-size:10px}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:rgba(79,179,255,.08)}
.calls,.notes{margin-top:14px}
.calls ol,.notes ol{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.calls li,.notes li{display:grid;grid-template-columns:52px 58px minmax(0,1fr);gap:8px;padding:5px 8px;background:#0a111a;border-left:3px solid var(--alert);font-size:.9rem}
.notes li{grid-template-columns:96px 58px minmax(0,1fr);border-left-color:var(--coach)}
.calls li.coach{border-left-color:var(--ok)}
.calls .t,.notes .t{font-family:var(--mono);color:var(--muted)}
.calls .src,.notes .src{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;align-self:center}
.calls li.helper .src{color:var(--alert)} .calls li.coach .src{color:var(--ok)} .notes .src{color:var(--coach)}
.calls button{margin-top:6px}
@media (max-width:560px){ .notes li{grid-template-columns:70px minmax(0,1fr)} .notes .src{display:none} }
</style>
<script src="/vendor/htmx.min.js"></script>
<script>
// Alpine state for the whole page; defined before Alpine (deferred) starts
function hist() {
  return {
    sel: null, result: "", plan: "", player: "<!--owner-->",
    init() {   // deep link: /history?game=25 opens that game (hx-push-url writes these)
      const g = new URLSearchParams(location.search).get("game");
      if (g && /^\d+$/.test(g)) { this.sel = +g; htmx.ajax("GET", `/history/game/${g}`, "#detail"); }
    },
    setResult(r) { this.result = r; this.refilter(); },
    refilter() { this.$nextTick(() => htmx.trigger(this.$refs.filters, "refilter")); },
  };
}
// htmx doesn't swap error responses; show them instead of leaving a stale panel
document.addEventListener("htmx:responseError", (e) => {
  const t = e.detail.target;
  if (t) t.innerHTML = e.detail.xhr.responseText || `<p class="empty">Error ${e.detail.xhr.status}</p>`;
});
// On a phone the detail sits under the list: bring it into view after a row click
document.addEventListener("htmx:afterSwap", (e) => {
  if (e.detail.target.id === "detail" && matchMedia("(max-width: 999px)").matches) e.detail.target.scrollIntoView();
});
</script>
<script src="/vendor/alpine.min.js" defer></script>
</head>
<body x-data="hist()">
<div class="wrap">
  <div class="top">
    <h1><b>SC2</b> Game history</h1>
    <span class="grow"></span>
    <form class="top" x-ref="filters" hx-get="/history/games" hx-target="#list" hx-trigger="load, refilter, change"
          hx-indicator="#list-panel" @submit.prevent>
      <input type="hidden" name="result" :value="result">
      <div class="seg" role="group" aria-label="Result">
        <button type="button" :aria-pressed="result === ''" @click="setResult('')">All</button>
        <button type="button" :aria-pressed="result === 'Victory'" @click="setResult('Victory')">Wins</button>
        <button type="button" :aria-pressed="result === 'Defeat'" @click="setResult('Defeat')">Losses</button>
      </div>
      <label>Player <select name="player" x-model="player"><!--players--></select></label>
      <label>Plan <select name="plan" x-model="plan"><option value="">All</option><!--plans--></select></label>
    </form>
    <a href="/" class="dim">Live page</a>
  </div>
  <div class="main">
    <section class="panel" id="list-panel"><span class="busy">loading…</span><div id="list"></div></section>
    <section class="panel" id="detail"><p class="empty">Pick a game to see its supply, bank, calls and notes.</p></section>
  </div>
</div>
</body>
</html>
